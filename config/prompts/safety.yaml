# ============================================================
# 安全相关提示词与模板 — 配合标签体系双层防御
#
# 安全敏感 ★ 标签（仅8个，仅即时生命危险场景，由 taxonomy.py 管理）：
#   BX: BX-01 燃气泄漏报警, BX-02 报警器鸣叫, BX-04 管道/接口漏气
#   AQ: AQ-02 泄漏应急处置, AQ-06 一氧化碳中毒预防
#   TQ: TQ-02 突发停气咨询, TQ-03 复气/点火服务
#   QT: QT-02 加装/迁改管道
#
# 收紧原则：只有正在发生的泄漏/中毒/爆炸才触发安全模板。
# 维修、咨询、预防、设备更换等不触发。
# 关键词检测 + 标签检测 = 双层防御
# ============================================================

# 安全关键词（精准匹配，避免信息咨询误触发）
# 原则：只保留明确描述危险场景的关键词，排除可作技术名词的词汇
keywords:
  - "漏气"
  - "煤气泄漏"
  - "燃气泄漏"
  - "天然气泄漏"
  - "闻到煤气味"
  - "煤气味"
  - "臭鸡蛋味"
  - "燃气异味"
  - "报警器"              # 覆盖所有变体(响/叫/报警/一直响)，非紧急语境过滤购买
  - "燃气报警"
  - "着火"
  - "起火"
  - "爆炸"
  - "燃气中毒"
  - "一氧化碳中毒"
  - "中毒"
  # 精准替代 "紧急" 和 "抢修"（不单独出现，避免误触发）：
  - "管破了"
  - "管道破裂"
  - "燃气管道破损"
  - "挖断管道"
  - "燃气着火"
  - "燃气起火"
  # 明确紧急场景的组合词：
  - "漏气了"
  - "漏气吗"
  - "闻到燃气"

# 否定语境（不触发安全的模式）
negation_patterns:
  - "打不着"
  - "点不着"
  - "不着火"
  - "打不燃"
  - "点不燃"
  - "熄火"
  - "打不开"
  - "开不了"
  - "打不着火"
  - "点不着火"

# 信息咨询类句式（不触发安全）
info_patterns:
  - "电话"
  - "多少"
  - "是什么"
  - "怎么查"
  - "在哪"
  - "号码"
  - "热线"

# 安全模板
templates:
  gas_leak:
    title: "⚠️ 燃气安全紧急处置"
    keywords: ["漏气", "煤气泄漏", "燃气泄漏", "天然气泄漏", "煤气味", "臭鸡蛋味", "燃气异味"]
    steps:
      - "① 立即关闭燃气总阀门"
      - "② 打开所有门窗，保持通风"
      - "③ 切勿开关任何电器（包括电灯、排风扇、抽油烟机）"
      - "④ 不要使用明火、打火机、手机在现场拨打"
      - "⑤ 迅速撤离到室外安全区域"
      - "⑥ 在室外拨打24小时抢修专线：95777"
      - "⑦ 在专业人员到达前，不要返回室内"
    warnings:
      - "🚫 禁止开关电器"
      - "🚫 禁止使用明火"
      - "🚫 禁止在现场拨打电话"
      - "🚫 禁止启动车辆"
    transfer: true
    transfer_msg: "已为您优先接入人工客服和抢修调度，请保持电话畅通。"

  alarm:
    title: "⚠️ 燃气报警器报警处置"
    keywords: ["报警器", "燃气报警"]
    steps:
      - "① 不要慌张，立即关闭燃气总阀"
      - "② 打开门窗通风"
      - "③ 不要开关任何电器"
      - "④ 撤离到室外安全区域"
      - "⑤ 拨打24小时抢修专线：95777"
      - "⑥ 等待专业人员检查，确定原因后方可恢复用气"
    warnings:
      - "🚫 不要自行拆卸报警器"
      - "🚫 不要在未查明原因前恢复用气"
    transfer: true
    transfer_msg: "已为您转接抢修专线，请保持电话畅通。"

  poisoning:
    title: "⚠️ 燃气中毒紧急处置"
    keywords: ["燃气中毒", "一氧化碳中毒", "中毒"]
    steps:
      - "① 立即打开门窗通风"
      - "② 将中毒者移至空气新鲜处"
      - "③ 解开衣领、裤带，保持呼吸道通畅"
      - "④ 注意保暖，防止受凉"
      - "⑤ 立即拨打120急救电话"
      - "⑥ 同时拨打抢修专线：95777"
      - "⑦ 如有呼吸心跳停止，立即进行心肺复苏"
    warnings:
      - "🚨 生命危险！立即行动！"
      - "🚫 不要在没有防护的情况下进入高浓度泄漏区域"
    transfer: true
    transfer_msg: "已同时通知120急救和燃气抢修，请保持电话畅通。"

  fire_explosion:
    title: "⚠️ 燃气火灾/爆炸紧急处置"
    keywords: ["着火", "起火", "爆炸", "火灾"]
    steps:
      - "① 立即关闭燃气总阀（如可安全接近）"
      - "② 立即拨打119火警"
      - "③ 拨打抢修专线：95777"
      - "④ 迅速疏散，远离事故现场"
      - "⑤ 不要乘坐电梯"
      - "⑥ 不要返回现场取财物"
    warnings:
      - "🚨 生命第一！立即疏散！"
      - "🚫 不要试图自行灭火（除非火势很小且你有把握）"
      - "🚫 不要乘坐电梯"
    transfer: true
    transfer_msg: "已同时通知119和燃气抢修，请立即撤离到安全区域。"

  pipe_damage:
    title: "⚠️ 燃气管道破损处置"
    keywords: ["管破了", "管道破裂", "燃气管道破损", "挖断管道"]
    steps:
      - "① 立即远离破损位置，到上风方向"
      - "② 禁止一切明火和电器操作"
      - "③ 拨打24小时抢修专线：95777"
      - "④ 在安全区域等待专业人员到达"
      - "⑤ 提醒周围人员撤离"
    warnings:
      - "🚫 禁止靠近破损管道"
      - "🚫 禁止使用手机在现场拨打"
      - "🚫 禁止启动车辆"
    transfer: true
    transfer_msg: "已通知抢修队紧急出动，请保持电话畅通。"
