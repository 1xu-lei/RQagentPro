# 法规依据表（唯一真相源）
# FG-15~FG-49 = 《城镇燃气管理条例》条文编号
# FG-层级-序号 = 整部法规：FL法律 / XZ行政法规 / BM部门规章 / DF地方 / HY工程建设规范 / CZ公司规范
FG-15:
  name: 城镇燃气管理条例
  level: 行政法规
  title: 第十五条
  summary: 燃气经营实行许可证制度；经营者须符合规划、有合格气源设施、固定场所等条件
  scenarios:
  - 报装开户
  - 经营资质咨询
FG-17:
  name: 城镇燃气管理条例
  level: 行政法规
  title: 第十七条
  summary: 经营者应持续稳定安全供气，指导安全用气，定期安检；应公示业务流程、服务承诺、收费标准和服务热线
  scenarios:
  - 供气保障
  - 收费公示
  - 热线/网点咨询
FG-18:
  name: 城镇燃气管理条例
  level: 行政法规
  title: 第十八条
  summary: 经营者禁止：拒绝向管网覆盖内合规用户供气、擅自停/调供气、指定购买产品或服务
  scenarios:
  - 拒供投诉
  - 擅自停气投诉
FG-19:
  name: 城镇燃气管理条例
  level: 行政法规
  title: 第十九条
  summary: 管道经营者对市政设施、业主专有部分以外的设施承担运行、维护、抢修和更新改造责任
  scenarios:
  - 抢修责任划分
  - 设施维护
  - 表具故障
FG-20:
  name: 城镇燃气管理条例
  level: 行政法规
  title: 第二十条
  summary: 因施工检修临时调整或暂停供气，应提前48小时公告或书面通知用户并及时恢复；突发影响应采取紧急措施
  scenarios:
  - 计划/突发停气
  - 复气咨询
FG-21:
  name: 城镇燃气管理条例
  level: 行政法规
  title: 第二十一条
  summary: 经营者未及时恢复供气、擅自停歇业等情形，燃气管理部门应采取措施保障用户正常用气
  scenarios:
  - 长时间停气
  - 保供投诉
FG-23:
  name: 城镇燃气管理条例
  level: 行政法规
  title: 第二十三条
  summary: 燃气销售价格按购气成本、经营成本、当地经济水平合理确定并适时调整；调价应征求用户意见
  scenarios:
  - 气价
  - 调价
  - 收费项目咨询
FG-27:
  name: 城镇燃气管理条例
  level: 行政法规
  title: 第二十七条
  summary: 用户应遵守安全用气规则，使用合格器具，及时更换超年限器具和连接管，按期支付燃气费用
  scenarios:
  - 安全用气
  - 器具超期更换
  - 欠费缴费
FG-28:
  name: 城镇燃气管理条例
  level: 行政法规
  title: 第二十八条
  summary: 用户禁止：擅自操作公用阀门、管道作负重/接地、使用不符气源器具、擅自安改拆户内设施、盗用燃气、改变用途或转供
  scenarios:
  - 用户禁止行为
  - 私改管道
  - 偷气咨询
FG-29:
  name: 城镇燃气管理条例
  level: 行政法规
  title: 第二十九条
  summary: 用户可对收费、服务查询，经营者5个工作日内答复；可向管理部门投诉，15个工作日内处理
  scenarios:
  - 查询答复时效
  - 投诉处理时效
FG-30:
  name: 城镇燃气管理条例
  level: 行政法规
  title: 第三十条
  summary: 安装、改装、拆除户内燃气设施应按国家工程建设标准作业
  scenarios:
  - 表具改移
  - 户内设施改造
FG-31:
  name: 城镇燃气管理条例
  level: 行政法规
  title: 第三十一条
  summary: 燃气管理部门公布本地燃气种类和气质成分；器具生产单位应标识适应的燃气种类
  scenarios:
  - 器具气源适配咨询
FG-32:
  name: 城镇燃气管理条例
  level: 行政法规
  title: 第三十二条
  summary: 燃气器具生产/销售单位应设立售后站点、配备考核合格安装维修人员；安装维修须符合国标
  scenarios:
  - 器具报修
  - 安装售后
FG-38:
  name: 城镇燃气管理条例
  level: 行政法规
  title: 第三十八条
  summary: 经营者改动市政燃气设施须制定方案并报燃气管理部门批准
  scenarios:
  - 管道迁改
  - 加装咨询
FG-40:
  name: 城镇燃气管理条例
  level: 行政法规
  title: 第四十条
  summary: 任何单位和个人发现燃气事故或隐患，应立即告知经营者或向燃气管理部门、公安消防机构报告
  scenarios:
  - 泄漏报警
  - 隐患上报
  - 应急处置
FG-42:
  name: 城镇燃气管理条例
  level: 行政法规
  title: 第四十二条
  summary: 事故发生后经营者应立即启动应急预案，组织抢险抢修；有关部门立即采取措施防止扩大
  scenarios:
  - 泄漏抢修
  - 事故应急
FG-49:
  name: 城镇燃气管理条例
  level: 行政法规
  title: 第四十九条
  summary: 用户擅自操作公用阀门、私改户内设施等，责令改正，逾期对个人处1000元以下、对单位处10万元以下罚款
  scenarios:
  - 违规改装/操作的法律后果告知
