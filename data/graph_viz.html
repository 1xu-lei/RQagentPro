: "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:41", "label": "安全距离和疏散通道有什么要求？", "title": "<b>Question</b><br>安全距离和疏散通道有什么要求？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:41", "label": "生产、经营、储存、使用危险物品的车间、商...", "title": "<b>Answer</b><br>生产、经营、储存、使用危险物品的车间、商店、仓库不得与员工宿舍在同一座建筑物内并应当与员工宿舍保持安全距离。生产经营场所和员工宿舍应当设有符合紧急疏散要求、标志明显、保持畅通的出口、疏散通道。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:476", "label": "衡阳市燃气企业需要建立应急制度吗？", "title": "<b>Question</b><br>衡阳市燃气企业需要建立应急制度吗？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:476", "label": "燃气供应企业必须建立管网巡检、安全检查、...", "title": "<b>Answer</b><br>燃气供应企业必须建立管网巡检、安全检查、维护维修、事故抢修等制度及事故抢险应急预案，及时报告、排除、处理燃气设施故障和事故，确保正常供气。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:727", "label": "厨房燃气火灾处理三步法", "title": "<b>Question</b><br>厨房燃气火灾处理三步法", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:727", "label": "小火自救：油锅起火→锅盖侧面平移盖住（或...", "title": "<b>Answer</b><br>小火自救：油锅起火→锅盖侧面平移盖住（或灭火毯），严禁泼水！灶具着火→关灶前阀→灭火器/灭火毯。管道着火→关上游阀门→火自灭。大火逃生：火势失控→关总阀（如果安全）→带家人撤离→关房门阻隔→到安全处打", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:728", "label": "燃气软管安全：不锈钢波纹管 vs 橡胶管", "title": "<b>Question</b><br>燃气软管安全：不锈钢波纹管 vs 橡胶管", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:728", "label": "【新国标GB55009】2022年1月1...", "title": "<b>Answer</b><br>【新国标GB55009】2022年1月1日起新装燃气灶必须使用不锈钢波纹软管（寿命8年），严禁传统橡胶软管。【橡胶管危害】寿命仅18个月，易老化龟裂、发粘、被老鼠咬破——是家庭燃气泄漏的第一大原因！【", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:793", "label": "火焰是黄色的有黑烟怎么回事？用天然气要注意什么？", "title": "<b>Question</b><br>火焰是黄色的有黑烟怎么回事？用天然气要注意什么？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:793", "label": "正常天然气火焰应为清晰蓝色。火焰发黄、有...", "title": "<b>Answer</b><br>正常天然气火焰应为清晰蓝色。火焰发黄、有黑烟、脱火、回火均为异常，常见原因：风门调节不当、火盖堵塞、灶具老化、压力异常。请先关闭灶具，清理火盖调节风门，无法解决请停止使用并报修。用气时注意通风，有人看", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:873", "label": "天然气蓝色火焰和黄色火焰有什么区别？", "title": "<b>Question</b><br>天然气蓝色火焰和黄色火焰有什么区别？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:873", "label": "蓝色火焰表示充分燃烧——天然气与空气混合...", "title": "<b>Answer</b><br>蓝色火焰表示充分燃烧——天然气与空气混合比例合适燃烧效率高且不产生一氧化碳。黄色或红色火焰表示燃烧不充分——可能是火盖堵塞、风门调节不当或燃气压力异常。黄焰会产生一氧化碳且热效率低浪费燃气。如出现黄焰", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:874", "label": "用天然气做饭时要注意什么？", "title": "<b>Question</b><br>用天然气做饭时要注意什么？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:874", "label": "1.保持厨房通风开窗或开排气扇。2.做饭...", "title": "<b>Answer</b><br>1.保持厨房通风开窗或开排气扇。2.做饭时不要离开厨房防止汤水溢出浇灭火焰。3.灶具周围不要放易燃物。4.使用后随手关闭灶前阀。5.定期用肥皂水检查胶管接口是否漏气。6.如火焰发黄发红应清理火盖或调节", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:875", "label": "长时间不在家要关燃气阀门吗？", "title": "<b>Question</b><br>长时间不在家要关燃气阀门吗？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:875", "label": "长时间外出前应：1.关闭燃气表前总阀门。...", "title": "<b>Answer</b><br>长时间外出前应：1.关闭燃气表前总阀门。2.关闭灶前阀。3.检查所有燃气器具是否已关闭。4.建议告知物业留钥匙以便紧急情况入户。5.回家后先开窗通风再开启阀门。6.如回家闻到燃气味勿开灯和电器立即开窗", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:876", "label": "冬天用燃气取暖要注意什么？", "title": "<b>Question</b><br>冬天用燃气取暖要注意什么？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:876", "label": "1.必须使用正规燃气采暖炉严禁用燃气灶取...", "title": "<b>Answer</b><br>1.必须使用正规燃气采暖炉严禁用燃气灶取暖会大量消耗室内氧气并产生一氧化碳。2.采暖炉排烟管必须伸出室外且接口密封严密。3.使用采暖炉时房间必须保持通风。4.采暖炉每年入冬前应进行一次专业检修。5.采", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:877", "label": "厨房有天然气管道能改成卧室吗？", "title": "<b>Question</b><br>厨房有天然气管道能改成卧室吗？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:877", "label": "绝对不能。《城镇燃气管理条例》第二十八条...", "title": "<b>Answer</b><br>绝对不能。《城镇燃气管理条例》第二十八条规定不得在不具备安全条件的场所使用和储存燃气。燃气管道通过的房间必须保持良好的自然通风和天然采光。将厨房改为卧室属于改变用气场所用途一旦燃气泄漏将直接危及生命。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:878", "label": "小区燃气调压箱附近能停车或堆放杂物吗？", "title": "<b>Question</b><br>小区燃气调压箱附近能停车或堆放杂物吗？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:878", "label": "不能。燃气调压箱周围应保持通畅不得堆放杂...", "title": "<b>Answer</b><br>不能。燃气调压箱周围应保持通畅不得堆放杂物停放车辆搭建建筑物。调压设施是小区供气的核心一旦被碰撞损坏轻则整小区停气重则燃气泄漏引发爆炸。如发现有人在调压箱附近堆放杂物或施工请提醒制止或拨打0734-8", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:919", "label": "开放式厨房为什么不能通天然气？", "title": "<b>Question</b><br>开放式厨房为什么不能通天然气？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:919", "label": "根据GB55009-2021《燃气工程项...", "title": "<b>Answer</b><br>根据GB55009-2021《燃气工程项目规范》，燃气灶具应安装在有自然通风和天然采光的厨房内，厨房须有门与起居室隔开。开放式厨房一旦燃气泄漏，气体会迅速扩散至整个居住空间，遇明火极易爆炸。解决方案：", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:920", "label": "家里有婴儿用天然气要注意什么？", "title": "<b>Question</b><br>家里有婴儿用天然气要注意什么？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:920", "label": "有婴幼儿的家庭用气特别注意：1.确保厨房...", "title": "<b>Answer</b><br>有婴幼儿的家庭用气特别注意：1.确保厨房通风良好。2.安装燃气报警器及时发现泄漏。3.不要在厨房放置婴儿床或让婴儿在厨房逗留。4.定期检查胶管和接口防止微漏。5.使用带有熄火保护装置的灶具。6.教育大", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:944", "label": "洗澡时突然没热水了是停气了吗", "title": "<b>Question</b><br>洗澡时突然没热水了是停气了吗", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:944", "label": "先检查燃气灶是否能正常点火。如灶具也点不...", "title": "<b>Answer</b><br>先检查燃气灶是否能正常点火。如灶具也点不着：可能是燃气表欠费关阀或表前总阀被误关或报警器触发切断。如灶具正常但热水器不工作则是热水器本身故障。拨打0734-8677777报修。停气和热水器故障是两回事", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:946", "label": "夏天开空调关门窗用燃气安全吗", "title": "<b>Question</b><br>夏天开空调关门窗用燃气安全吗", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:946", "label": "开空调关门窗用燃气极度危险须保证至少一扇...", "title": "<b>Answer</b><br>开空调关门窗用燃气极度危险须保证至少一扇窗开启5至10厘米。燃气灶使用时消耗室内氧气密闭空间易缺氧产生一氧化碳。使用燃气热水器洗澡时不可闭门闭窗开空调。如感到头晕胸闷立即停止用气开窗通风。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:947", "label": "新装修的房子第一次通天然气要检查什么", "title": "<b>Question</b><br>新装修的房子第一次通天然气要检查什么", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:947", "label": "厨房须有门与起居室隔开。燃气管道不得暗埋...", "title": "<b>Answer</b><br>厨房须有门与起居室隔开。燃气管道不得暗埋在墙内。灶具须有熄火保护装置和CCC认证。胶管已更换为不锈钢波纹管。热水器排烟管伸出室外接口密封。燃气表周围有通风空间。所有接口肥皂水测试无泄漏。报警器已安装能", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:990", "label": "油锅起火了能用燃气灶继续烧吗", "title": "<b>Question</b><br>油锅起火了能用燃气灶继续烧吗", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:990", "label": "绝对不能。油锅起火应立即：关闭灶前阀和燃...", "title": "<b>Answer</b><br>绝对不能。油锅起火应立即：关闭灶前阀和燃气总阀。用锅盖从侧面平移盖住油锅隔绝空气。或用灭火毯覆盖。切勿用水浇油火水遇油会爆溅扩大火势。火灭后不要立即打开锅盖待油温降至安全温度。检查灶具和抽油烟机是否受", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:991", "label": "燃气引起的火灾灭后多久能恢复用气", "title": "<b>Question</b><br>燃气引起的火灾灭后多久能恢复用气", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:991", "label": "火灾后恢复用气流程：必须由燃气公司专业人...", "title": "<b>Answer</b><br>火灾后恢复用气流程：必须由燃气公司专业人员现场检查整条管道和表具是否受损。检查合格后由燃气公司重新点火通气。自行恢复用气极度危险管道可能已受损漏气。拨打0734-8677777预约灾后安全检查和恢复供", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:1002", "label": "独立强排风系统和商业厨房送排风系统可否合二为一？", "title": "<b>Question</b><br>独立强排风系统和商业厨房送排风系统可否合二为一？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:1002", "label": "不能合二为一，两者设置的原理和目的不同。...", "title": "<b>Answer</b><br>不能合二为一，两者设置的原理和目的不同。（1）强排风系统：用气设备设置在地下室、半地下室或地上密闭房间内时，应设置独立强排风系统、泄漏报警器、紧急切断阀，三者互相联动。当发生燃气泄漏，燃气泄漏报警器报", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:19", "label": "企业需要具备什么安全生产条件？", "title": "<b>Question</b><br>企业需要具备什么安全生产条件？", "color": {"bg": "#FB8C00", "border": "#E65100", "shape": "box", "size": 10}, "shape": "box", "size": 10, "group": "Question"}, {"id": "A:19", "label": "生产经营单位应当具备本法和有关法律、行政...", "title": "<b>Answer</b><br>生产经营单位应当具备本法和有关法律、行政法规和国家标准或者行业标准规定的安全生产条件；不具备安全生产条件的不得从事生产经营活动。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:23", "label": "企业需要设置安全管理机构吗？", "title": "<b>Question</b><br>企业需要设置安全管理机构吗？", "color": {"bg": "#FB8C00", "border": "#E65100", "shape": "box", "size": 10}, "shape": "box", "size": 10, "group": "Question"}, {"id": "A:23", "label": "矿山、金属冶炼、建筑施工、运输单位和危险...", "title": "<b>Answer</b><br>矿山、金属冶炼、建筑施工、运输单位和危险物品的生产、经营、储存、装卸单位应当设置安全生产管理机构或者配备专职安全生产管理人员。从业人员超过一百人的应当设置安全生产管理机构或者配备专职安全生产管理人员；", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:26", "label": "安全管理人员需要什么能力？", "title": "<b>Question</b><br>安全管理人员需要什么能力？", "color": {"bg": "#FB8C00", "border": "#E65100", "shape": "box", "size": 10}, "shape": "box", "size": 10, "group": "Question"}, {"id": "A:26", "label": "生产经营单位的主要负责人和安全生产管理人...", "title": "<b>Answer</b><br>生产经营单位的主要负责人和安全生产管理人员必须具备与本单位所从事的生产经营活动相应的安全生产知识和管理能力。危险物品的生产、经营、储存、装卸单位以及矿山、金属冶炼、建筑施工、运输单位的主要负责人和安全", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:145", "label": "消防设施有哪些禁止行为？", "title": "<b>Question</b><br>消防设施有哪些禁止行为？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:145", "label": "任何单位、个人不得损坏、挪用或者擅自拆除...", "title": "<b>Answer</b><br>任何单位、个人不得损坏、挪用或者擅自拆除、停用消防设施、器材，不得占用、堵塞、封闭疏散通道、安全出口、消防车通道。人员密集场所的门窗不得设置影响逃生和灭火救援的障碍物。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:285", "label": "燃气设施保护范围是什么？", "title": "<b>Question</b><br>燃气设施保护范围是什么？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:285", "label": "县级以上地方人民政府燃气管理部门应当会同...", "title": "<b>Answer</b><br>县级以上地方人民政府燃气管理部门应当会同城乡规划等有关部门按照国家有关标准和规定划定燃气设施保护范围并向社会公布。在燃气设施保护范围内禁止从事下列危及燃气设施安全的活动：（一）建设占压地下燃气管线的建", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:420", "label": "湖南省燃气设施安全保护范围内禁止什么？", "title": "<b>Question</b><br>湖南省燃气设施安全保护范围内禁止什么？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:420", "label": "在国家规定的燃气设施安全保护范围内，禁止...", "title": "<b>Answer</b><br>在国家规定的燃气设施安全保护范围内，禁止下列行为：（一）擅自兴建与燃气设施无关的建筑物、构筑物；（二）进行危害燃气设施安全的作业；（三）存放易燃易爆物品或者倾倒、排放腐蚀性物品；（四）其他可能危害燃气", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:457", "label": "衡阳市燃气施工有什么管理要求？", "title": "<b>Question</b><br>衡阳市燃气施工有什么管理要求？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:457", "label": "燃气工程施工单位应按规范和技术要求确保质...", "title": "<b>Answer</b><br>燃气工程施工单位应按规范和技术要求确保质量和安全，因施工或抢修对市政设施等造成损坏的应及时修复或赔偿。按照规划经批准铺设燃气管道，公示后任何单位和个人无正当理由不得阻挠施工安装。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:469", "label": "衡阳市燃气设施需要设置警示标志吗？", "title": "<b>Question</b><br>衡阳市燃气设施需要设置警示标志吗？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:469", "label": "燃气企业应当对有关燃气设施设置统一、明显...", "title": "<b>Answer</b><br>燃气企业应当对有关燃气设施设置统一、明显的安全警示标志，并配备专职人员进行巡回检查。禁止毁坏、涂改或者擅自拆除、移动燃气设施安全警示标志。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:471", "label": "衡阳市燃气设施保护范围内禁止什么？", "title": "<b>Question</b><br>衡阳市燃气设施保护范围内禁止什么？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:471", "label": "禁止下列行为：（一）擅自兴建与燃气设施无...", "title": "<b>Answer</b><br>禁止下列行为：（一）擅自兴建与燃气设施无关的建筑物；（二）擅自挖掘取土、焊接烘烤、焚烧垃圾、燃放烟花、爆破或碾压；（三）种植深根植物或设置电杆；（四）存放易燃易爆物品或倾倒腐蚀性物品；（五）将燃气管道", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:573", "label": "燃气管道不能穿越哪些场所？", "title": "<b>Question</b><br>燃气管道不能穿越哪些场所？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:573", "label": "燃气水平干管和立管不得穿过易燃易爆品仓库...", "title": "<b>Answer</b><br>燃气水平干管和立管不得穿过易燃易爆品仓库、配电间、变电室、电缆沟、烟道、进风道和电梯井等。该条已于2022年1月1日起废止，详见新规《燃气工程项目规范》GB55009-2021。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:576", "label": "燃气管道竖井设置有什么要求？", "title": "<b>Question</b><br>燃气管道竖井设置有什么要求？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:576", "label": "燃气立管设在管道竖井内时：可与空气、上下...", "title": "<b>Answer</b><br>燃气立管设在管道竖井内时：可与空气、上下水、热力管道共井，不得与电线、电气设备等共井；最高压力≤0.2MPa；每隔2-3层防火分隔；每隔4-5层设燃气浓度检测报警器。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:35", "label": "安全设备有什么要求？使用燃气需要安装报警装置吗？", "title": "<b>Question</b><br>安全设备有什么要求？使用燃气需要安装报警装置吗？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:35", "label": "安全设备的设计、制造、安装、使用、检测、...", "title": "<b>Answer</b><br>安全设备的设计、制造、安装、使用、检测、维修、改造和报废应当符合国家标准或者行业标准。餐饮等行业的生产经营单位使用燃气的应当安装可燃气体报警装置并保障其正常使用。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:138", "label": "明火作业有什么要求？", "title": "<b>Question</b><br>明火作业有什么要求？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:138", "label": "禁止在具有火灾、爆炸危险的场所吸烟、使用...", "title": "<b>Answer</b><br>禁止在具有火灾、爆炸危险的场所吸烟、使用明火。因施工等特殊情况需要使用明火作业的，应当按照规定事先办理审批手续，采取相应的消防安全措施。进行电焊、气焊等具有火灾危险作业的人员和自动消防系统的操作人员，", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:597", "label": "住宅厨房需要设排气和报警装置吗？", "title": "<b>Question</b><br>住宅厨房需要设排气和报警装置吗？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:597", "label": "住宅厨房内宜设置排气装置和燃气浓度检测报...", "title": "<b>Answer</b><br>住宅厨房内宜设置排气装置和燃气浓度检测报警器。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:598", "label": "家用燃气灶安装有什么要求？", "title": "<b>Question</b><br>家用燃气灶安装有什么要求？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:598", "label": "燃气灶应安装在有自然通风和自然采光的厨房...", "title": "<b>Answer</b><br>燃气灶应安装在有自然通风和自然采光的厨房内；净高≥2.2m；灶与墙面净距≥10cm；灶台应采用不燃烧材料。暗厨房应选用带熄火保护装置的燃气灶，并设置燃气报警器、自动切断阀和机械通风设施。第4款已于20", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:605", "label": "商业用气设备设置在地下室有什么要求？", "title": "<b>Question</b><br>商业用气设备设置在地下室有什么要求？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:605", "label": "设在地下室、半地下室或地上密闭房间时：设...", "title": "<b>Answer</b><br>设在地下室、半地下室或地上密闭房间时：设手动快速切断阀和紧急自动切断阀；用气设备应有熄火保护装置；应设置燃气浓度检测报警器；应设置独立的机械送排风系统。第1、3款和第4款第1、3项已于2022年1月1", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:609", "label": "燃气锅炉和直燃机有什么安全技术措施？", "title": "<b>Question</b><br>燃气锅炉和直燃机有什么安全技术措施？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:609", "label": "燃烧器应有多种安全保护自动控制功能；应有...", "title": "<b>Answer</b><br>燃烧器应有多种安全保护自动控制功能；应有可靠的排烟设施和通风设施；应设置火灾自动报警系统和自动灭火系统。第3款已于2022年1月1日起废止，详见新规《燃气工程项目规范》GB55009-2021。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:617", "label": "工业企业燃烧装置有什么安全设施？", "title": "<b>Question</b><br>工业企业燃烧装置有什么安全设施？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:617", "label": "燃气管道上应安装低压和超压报警以及紧急自...", "title": "<b>Answer</b><br>燃气管道上应安装低压和超压报警以及紧急自动切断阀；烟道和封闭式炉膛应设置泄爆装置；鼓风机和空气管道应设静电接地装置。该条已于2022年1月1日起废止，详见新规《燃气工程项目规范》GB55009-202", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:623", "label": "浴室燃气热水器排气有什么要求？", "title": "<b>Question</b><br>浴室燃气热水器排气有什么要求？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:623", "label": "浴室用燃气热水器的给排气口应直接通向室外...", "title": "<b>Answer</b><br>浴室用燃气热水器的给排气口应直接通向室外，其排气系统与浴室必须有防止烟气泄漏的措施。该条已于2022年1月1日起废止，详见新规《燃气工程项目规范》GB55009-2021。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:630", "label": "哪些场所必须设置燃气报警器？", "title": "<b>Question</b><br>哪些场所必须设置燃气报警器？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:630", "label": "下列场所应设置燃气浓度检测报警器：1.封...", "title": "<b>Answer</b><br>下列场所应设置燃气浓度检测报警器：1.封闭式燃气调压、计量间；2.地下室、半地下室和地上密闭的用气房间；3.燃气管道竖井；4.地下室引入管穿墙处；5.有燃气管道的管道层。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:631", "label": "燃气报警器安装高度有什么要求？", "title": "<b>Question</b><br>燃气报警器安装高度有什么要求？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:631", "label": "检测比空气轻的燃气（天然气）时安装高度距...", "title": "<b>Answer</b><br>检测比空气轻的燃气（天然气）时安装高度距顶棚≤0.3m；检测比空气重的燃气（液化石油气）时安装高度距地面≤0.3m。宜与排风扇等排气设备连锁。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:632", "label": "哪些场所宜设置燃气紧急切断阀？", "title": "<b>Question</b><br>哪些场所宜设置燃气紧急切断阀？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:632", "label": "下列场所宜设置燃气紧急自动切断阀：1.地...", "title": "<b>Answer</b><br>下列场所宜设置燃气紧急自动切断阀：1.地下室、半地下室和地上密闭的用气房间；2.一类高层民用建筑；3.燃气用量大、人员密集的商业建筑；4.重要的公共建筑；5.有燃气管道的管道层。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:633", "label": "燃气紧急切断阀设置有什么要求？", "title": "<b>Question</b><br>燃气紧急切断阀设置有什么要求？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:633", "label": "应设在用气场所的燃气入口管、干管或总管上...", "title": "<b>Answer</b><br>应设在用气场所的燃气入口管、干管或总管上；宜设在室外；前应设手动切断阀；宜采用自动关闭、现场人工开启型。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:49", "label": "发生事故时主要负责人应该怎么做？", "title": "<b>Question</b><br>发生事故时主要负责人应该怎么做？", "color": {"bg": "#FB8C00", "border": "#E65100", "shape": "box", "size": 10}, "shape": "box", "size": 10, "group": "Question"}, {"id": "A:49", "label": "生产经营单位发生生产安全事故时单位的主要...", "title": "<b>Answer</b><br>生产经营单位发生生产安全事故时单位的主要负责人应当立即组织抢救并不得在事故调查处理期间擅离职守。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:54", "label": "紧急情况下从业人员可以撤离吗？", "title": "<b>Question</b><br>紧急情况下从业人员可以撤离吗？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:54", "label": "从业人员发现直接危及人身安全的紧急情况时...", "title": "<b>Answer</b><br>从业人员发现直接危及人身安全的紧急情况时有权停止作业或者在采取可能的应急措施后撤离作业场所。生产经营单位不得因从业人员在紧急情况下停止作业或者采取紧急撤离措施而降低其工资、福利等待遇或者解除与其订立的", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:55", "label": "发生事故受伤了怎么赔偿？", "title": "<b>Question</b><br>发生事故受伤了怎么赔偿？", "color": {"bg": "#FB8C00", "border": "#E65100", "shape": "box", "size": 10}, "shape": "box", "size": 10, "group": "Question"}, {"id": "A:55", "label": "生产经营单位发生生产安全事故后应当及时采...", "title": "<b>Answer</b><br>生产经营单位发生生产安全事故后应当及时采取措施救治有关人员。因生产安全事故受到损害的从业人员除依法享有工伤保险外依照有关民事法律尚有获得赔偿的权利的有权提出赔偿要求。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:161", "label": "发现火灾应该怎么做？", "title": "<b>Question</b><br>发现火灾应该怎么做？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:161", "label": "任何人发现火灾都应当立即报警。任何单位、...", "title": "<b>Answer</b><br>任何人发现火灾都应当立即报警。任何单位、个人都应当无偿为报警提供便利，不得阻拦报警。人员密集场所发生火灾，该场所的现场工作人员应当立即组织、引导在场人员疏散。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:265", "label": "燃气供应中断怎么应对？", "title": "<b>Question</b><br>燃气供应中断怎么应对？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:265", "label": "燃气供应严重短缺、供应中断等突发事件发生...", "title": "<b>Answer</b><br>燃气供应严重短缺、供应中断等突发事件发生后，县级以上地方人民政府应当及时采取动用储备、紧急调度等应急措施，燃气经营者以及其他有关单位和个人应当予以配合，承担相关应急任务。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:294", "label": "燃气安全事故发生后怎么处置？", "title": "<b>Question</b><br>燃气安全事故发生后怎么处置？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:294", "label": "燃气安全事故发生后燃气经营者应当立即启动...", "title": "<b>Answer</b><br>燃气安全事故发生后燃气经营者应当立即启动本单位燃气安全事故应急预案组织抢险、抢修。燃气管理部门、安全生产监督管理部门和公安机关消防机构等有关部门和单位应当根据各自职责立即采取措施防止事故扩大根据有关情", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:372", "label": "特种设备使用单位需要制定应急预案吗？", "title": "<b>Question</b><br>特种设备使用单位需要制定应急预案吗？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:372", "label": "特种设备安全监督管理部门应当制定特种设备...", "title": "<b>Answer</b><br>特种设备安全监督管理部门应当制定特种设备应急预案。特种设备使用单位应当制定事故应急专项预案并定期进行事故应急演练。压力容器、压力管道发生爆炸或者泄漏在抢险救援时应当区分介质特性严格按照相关预案规定程序", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:478", "label": "衡阳市发现燃气事故怎么报告？", "title": "<b>Question</b><br>衡阳市发现燃气事故怎么报告？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:478", "label": "任何单位和个人发现燃气泄漏或者燃气引起的...", "title": "<b>Answer</b><br>任何单位和个人发现燃气泄漏或者燃气引起的中毒、火灾、爆炸等事故，有义务通知燃气供应企业以及公安消防等部门。燃气供应企业接到报告后应当立即组织抢修。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:723", "label": "燃气泄漏标准应急处置流程（五个关键步骤）", "title": "<b>Question</b><br>燃气泄漏标准应急处置流程（五个关键步骤）", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:723", "label": "开：立即打开所有门窗通风。关：关闭表前总...", "title": "<b>Answer</b><br>开：立即打开所有门窗通风。关：关闭表前总阀门切断气源。禁：严禁开关任何电器（灯/风扇/手机）、不使用打火机/门铃、不穿脱化纤衣物（静电）。撤：迅速撤离到室外安全地带（至少20米）。报：到室外拨打衡阳天", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:724", "label": "不同场景燃气泄漏的应对方法", "title": "<b>Question</b><br>不同场景燃气泄漏的应对方法", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:724", "label": "【自家漏气】关阀→开窗→撤离→报警。不要...", "title": "<b>Answer</b><br>【自家漏气】关阀→开窗→撤离→报警。不要开关任何电器！【楼道闻到味】可能是公共管道泄漏，走楼梯不乘电梯，到安全地点报警。【邻居家漏气】敲门不按门铃，无人应通知燃气公司和物业，不要自行破门。【路面冒泡有", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:790", "label": "燃气泄漏不能做什么？漏气了要注意什么？", "title": "<b>Question</b><br>燃气泄漏不能做什么？漏气了要注意什么？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:790", "label": "【安全警示】燃气泄漏时严禁：1.开关电灯...", "title": "<b>Answer</b><br>【安全警示】燃气泄漏时严禁：1.开关电灯、排风扇、抽油烟机等任何电器；2.在室内拨打电话、手机；3.使用明火、吸烟；4.按门铃；5.穿脱化纤衣物防止静电；6.不要尝试自行维修漏气部位。以上行为都可能引", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:879", "label": "闻到楼道里有天然气味道怎么办？", "title": "<b>Question</b><br>闻到楼道里有天然气味道怎么办？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:879", "label": "1.不要按门铃不要开关楼道灯不要使用电梯...", "title": "<b>Answer</b><br>1.不要按门铃不要开关楼道灯不要使用电梯任何电火花都可能引爆。2.立即敲邻居门提醒用手敲不用门铃。3.迅速走楼梯到室外安全区域。4.拨打0734-8677777和119报警。5.在抢修人员到达前劝阻他", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:880", "label": "怎么用肥皂水检查漏气？", "title": "<b>Question</b><br>怎么用肥皂水检查漏气？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:880", "label": "1.用洗洁精或肥皂加水调成泡沫水。2.用...", "title": "<b>Answer</b><br>1.用洗洁精或肥皂加水调成泡沫水。2.用刷子或海绵将肥皂水涂抹在怀疑漏气的部位：管道接头阀门接口胶管连接处表具接头等。3.观察是否有气泡不断冒出有气泡说明有泄漏。4.如发现漏气立即关闭该段管道上游阀门", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:881", "label": "燃气泄漏时为什么不能开灯或打电话？", "title": "<b>Question</b><br>燃气泄漏时为什么不能开灯或打电话？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:881", "label": "因为开关电器和打电话都会产生电火花。天然...", "title": "<b>Answer</b><br>因为开关电器和打电话都会产生电火花。天然气与空气混合达到5%至15%浓度时一个微小的电火花就足以引发爆炸。手机固定电话电灯开关排风扇抽油烟机甚至门铃——这些设备在工作时都会产生电火花。正确做法是轻手轻", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:923", "label": "晚上睡觉闻到煤气味但找不到哪里漏怎么办？", "title": "<b>Question</b><br>晚上睡觉闻到煤气味但找不到哪里漏怎么办？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:923", "label": "1.立即叫醒所有家人。2.不要开灯用手电...", "title": "<b>Answer</b><br>1.立即叫醒所有家人。2.不要开灯用手电筒或手机屏幕照明。3.轻手轻脚打开门窗通风。4.关闭燃气总阀。5.所有人迅速撤离到室外安全区域。6.到室外后拨打0734-8677777报抢修。7.等待专业人员", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:1018", "label": "家里闻到煤气味了怎么办", "title": "<b>Question</b><br>家里闻到煤气味了怎么办", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:1018", "label": "发现燃气泄漏时的紧急处置（关、开、离、报...", "title": "<b>Answer</b><br>发现燃气泄漏时的紧急处置（关、开、离、报四步）：1. 关——立即关闭燃气阀门（灶具阀、灶前阀、表前阀）；2. 开——迅速打开门窗通风，动作应轻缓，避免金属猛烈摩擦产生火花；3. 离——迅速撤离到户外安", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:63", "label": "安全生产审查验收收费吗？", "title": "<b>Question</b><br>安全生产审查验收收费吗？", "color": {"bg": "#FB8C00", "border": "#E65100", "shape": "box", "size": 10}, "shape": "box", "size": 10, "group": "Question"}, {"id": "A:63", "label": "负有安全生产监督管理职责的部门对涉及安全...", "title": "<b>Answer</b><br>负有安全生产监督管理职责的部门对涉及安全生产的事项进行审查、验收不得收取费用；不得要求接受审查、验收的单位购买其指定品牌或者指定生产、销售单位的安全设备、器材或者其他产品。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:90", "label": "安全审查验收违规收费怎么处理？", "title": "<b>Question</b><br>安全审查验收违规收费怎么处理？", "color": {"bg": "#FB8C00", "border": "#E65100", "shape": "box", "size": 10}, "shape": "box", "size": 10, "group": "Question"}, {"id": "A:90", "label": "负有安全生产监督管理职责的部门要求被审查...", "title": "<b>Answer</b><br>负有安全生产监督管理职责的部门要求被审查、验收的单位购买其指定的安全设备、器材或者其他产品的或者在对安全生产事项的审查、验收中收取费用的由其上级机关或者监察机关责令改正责令退还收取的费用；情节严重的对", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:173", "label": "消防检查收费吗？", "title": "<b>Question</b><br>消防检查收费吗？", "color": {"bg": "#FB8C00", "border": "#E65100", "shape": "box", "size": 10}, "shape": "box", "size": 10, "group": "Question"}, {"id": "A:173", "label": "住房和城乡建设主管部门、消防救援机构及其...", "title": "<b>Answer</b><br>住房和城乡建设主管部门、消防救援机构及其工作人员进行消防设计审查、消防验收、备案抽查和消防安全检查等不得收取费用，不得利用职务谋取利益。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:219", "label": "危害管道安全的行为有哪些？", "title": "<b>Question</b><br>危害管道安全的行为有哪些？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:219", "label": "禁止下列危害管道安全的行为：（一）擅自开...", "title": "<b>Answer</b><br>禁止下列危害管道安全的行为：（一）擅自开启、关闭管道阀门；（二）采用移动、切割、打孔、砸撬、拆卸等手段损坏管道；（三）移动、毁损、涂改管道标志；（四）在埋地管道上方巡查便道上行驶重型车辆；（五）在地面", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:220", "label": "管道附属设施上方有什么禁止行为？", "title": "<b>Question</b><br>管道附属设施上方有什么禁止行为？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:220", "label": "禁止在管道附属设施的上方架设电力线路、通...", "title": "<b>Answer</b><br>禁止在管道附属设施的上方架设电力线路、通信线路或者在储气库构造区域范围内进行工程挖掘、工程钻探、采矿。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:221", "label": "管道中心线两侧各五米范围内禁止什么？", "title": "<b>Question</b><br>管道中心线两侧各五米范围内禁止什么？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:221", "label": "在管道线路中心线两侧各五米地域范围内禁止...", "title": "<b>Answer</b><br>在管道线路中心线两侧各五米地域范围内禁止下列行为：（一）种植乔木、灌木、藤类、芦苇、竹子或者其他深根植物；（二）取土、采石、用火、堆放重物、排放腐蚀性物质、使用机械工具进行挖掘施工；（三）挖塘、修渠、", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:223", "label": "穿越河流的管道有什么保护要求？", "title": "<b>Question</b><br>穿越河流的管道有什么保护要求？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:223", "label": "在穿越河流的管道线路中心线两侧各500米...", "title": "<b>Answer</b><br>在穿越河流的管道线路中心线两侧各500米地域范围内禁止抛锚、拖锚、挖砂、挖泥、采石、水下爆破。为防洪和航道通畅而进行的养护疏浚作业除外。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:224", "label": "管道专用隧道有什么保护要求？", "title": "<b>Question</b><br>管道专用隧道有什么保护要求？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:224", "label": "在管道专用隧道中心线两侧各1000米地域...", "title": "<b>Answer</b><br>在管道专用隧道中心线两侧各1000米地域范围内禁止采石、采矿、爆破。因修建铁路、公路、水利工程等公共工程确需实施的应当经批准并采取安全防护措施。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:229", "label": "管道紧急抢修可以先行使用他人土地吗？", "title": "<b>Question</b><br>管道紧急抢修可以先行使用他人土地吗？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:229", "label": "管道企业在紧急情况下进行管道抢修作业可以...", "title": "<b>Answer</b><br>管道企业在紧急情况下进行管道抢修作业可以先行使用他人土地或者设施但应当及时告知所有权人或者使用权人。造成损失的应当依法给予赔偿。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:231", "label": "管道泄漏造成环境污染由谁治理？", "title": "<b>Question</b><br>管道泄漏造成环境污染由谁治理？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:231", "label": "管道泄漏的石油和因管道抢修排放的石油造成...", "title": "<b>Answer</b><br>管道泄漏的石油和因管道抢修排放的石油造成环境污染的管道企业应当及时治理。因第三人的行为致使管道泄漏造成环境污染的管道企业有权向第三人追偿治理费用。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:232", "label": "管道泄漏的石油由谁回收？", "title": "<b>Question</b><br>管道泄漏的石油由谁回收？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:232", "label": "管道泄漏的石油和因管道抢修排放的石油由管...", "title": "<b>Answer</b><br>管道泄漏的石油和因管道抢修排放的石油由管道企业回收、处理，任何单位和个人不得侵占、盗窃、哄抢。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:205", "label": "管道建设占用土地怎么补偿？", "title": "<b>Question</b><br>管道建设占用土地怎么补偿？", "color": {"bg": "#FB8C00", "border": "#E65100", "shape": "box", "size": 10}, "shape": "box", "size": 10, "group": "Question"}, {"id": "A:205", "label": "管道建设使用土地依照《中华人民共和国土地...", "title": "<b>Answer</b><br>管道建设使用土地依照《中华人民共和国土地管理法》等法律、行政法规的规定执行。依法建设的管道通过集体所有的土地或者他人取得使用权的国有土地影响土地使用的管道企业应当按照管道建设时土地的用途给予补偿。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:206", "label": "管道建设需要什么开工条件？", "title": "<b>Question</b><br>管道建设需要什么开工条件？", "color": {"bg": "#FB8C00", "border": "#E65100", "shape": "box", "size": 10}, "shape": "box", "size": 10, "group": "Question"}, {"id": "A:206", "label": "依照法律和国务院的规定取得行政许可或者已...", "title": "<b>Answer</b><br>依照法律和国务院的规定取得行政许可或者已报送备案并符合开工条件的管道项目的建设任何单位和个人不得阻碍。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:266", "label": "燃气经营者怎么选择？", "title": "<b>Question</b><br>燃气经营者怎么选择？", "color": {"bg": "#FB8C00", "border": "#E65100", "shape": "box", "size": 10}, "shape": "box", "size": 10, "group": "Question"}, {"id": "A:266", "label": "政府投资建设的燃气设施应当通过招标投标方...", "title": "<b>Answer</b><br>政府投资建设的燃气设施应当通过招标投标方式选择燃气经营者。社会资金投资建设的燃气设施投资方可以自行经营也可以另行选择燃气经营者。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:272", "label": "停气需要提前通知吗？", "title": "<b>Question</b><br>停气需要提前通知吗？", "color": {"bg": "#FB8C00", "border": "#E65100", "shape": "box", "size": 10}, "shape": "box", "size": 10, "group": "Question"}, {"id": "A:272", "label": "管道燃气经营者因施工、检修等原因需要临时...", "title": "<b>Answer</b><br>管道燃气经营者因施工、检修等原因需要临时调整供气量或者暂停供气的应当将作业时间和影响区域提前48小时予以公告或者书面通知燃气用户并按照有关规定及时恢复正常供气；因突发事件影响供气的应当采取紧急措施并及", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:435", "label": "湖南省管道燃气用户不缴费会停气吗？", "title": "<b>Question</b><br>湖南省管道燃气用户不缴费会停气吗？", "color": {"bg": "#FB8C00", "border": "#E65100", "shape": "box", "size": 10}, "shape": "box", "size": 10, "group": "Question"}, {"id": "A:435", "label": "管道燃气用户应当按照合同约定及时支付燃气...", "title": "<b>Answer</b><br>管道燃气用户应当按照合同约定及时支付燃气费。逾期不支付的，管道燃气供应企业可以按照国家规定的程序中止供气。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:482", "label": "衡阳市燃气费逾期未交怎么处理？", "title": "<b>Question</b><br>衡阳市燃气费逾期未交怎么处理？", "color": {"bg": "#FB8C00", "border": "#E65100", "shape": "box", "size": 10}, "shape": "box", "size": 10, "group": "Question"}, {"id": "A:482", "label": "管道燃气用户逾期不支付燃气费的，燃气供应...", "title": "<b>Answer</b><br>管道燃气用户逾期不支付燃气费的，燃气供应企业可以按日加收千分之三的滞纳金；逾期二个月仍不支付的，经燃气主管部门批准并提前三日书面通知用户，可以暂时停止供气。用户支付费用后二十四小时内恢复供气。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:280", "label": "燃气用户有什么禁止行为？", "title": "<b>Question</b><br>燃气用户有什么禁止行为？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:280", "label": "燃气用户及相关单位和个人不得有下列行为：...", "title": "<b>Answer</b><br>燃气用户及相关单位和个人不得有下列行为：（一）擅自操作公用燃气阀门；（二）将燃气管道作为负重支架或者接地引线；（三）安装、使用不符合气源要求的燃气燃烧器具；（四）擅自安装、改装、拆除户内燃气设施和燃气", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:421", "label": "湖南省对燃气设施有什么保护规定？", "title": "<b>Question</b><br>湖南省对燃气设施有什么保护规定？", "color": {"bg": "#FB8C00", "border": "#FF0000", "shape": "box", "size": 15}, "shape": "box", "size": 15, "group": "Question"}, {"id": "A:421", "label": "禁止毁坏或者擅自拆除、迁移燃气设施。除灭...", "title": "<b>Answer</b><br>禁止毁坏或者擅自拆除、迁移燃气设施。除灭火救援和燃气严重泄漏等紧急情况外，未经燃气供应企业同意，任何人不得开启或者关闭燃气管道的公共阀门。", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:437", "label": "湖南省燃气用户有什么义务？", "title": "<b>Question</b><br>湖南省燃气用户有什么义务？", "color": {"bg": "#FB8C00", "border": "#E65100", "shape": "box", "size": 10}, "shape": "box", "size": 10, "group": "Question"}, {"id": "A:437", "label": "燃气用户应当遵守下列规定：（一）按照规定...", "title": "<b>Answer</b><br>燃气用户应当遵守下列规定：（一）按照规定安全使用燃气；（二）管道燃气用户应当使用与当地燃气相适配的燃气燃烧器具；（三）无正当理由不得拒绝持有合法证件的燃气工作人员入户进行燃气使用安全检查；（四）不得违", "color": {"bg": "#9E9E9E", "border": "#424242", "shape": "box", "size": 8}, "shape": "box", "size": 8, "group": "Answer"}, {"id": "Q:475", "label": "衡阳市燃气公共阀门可以随意操作吗？", "title": "<b>Question</b><br>衡阳市燃气公共阀门可 const container = document.getElementById('mynetwork');
const data = { nodes, edges };
const options = {
    physics: {
        solver: 'forceAtlas2Based',
        forceAtlas2Based: {
            gravitationalConstant: -80,
            centralGravity: 0.005,
            springLength: 150,
            springConstant: 0.02,
            damping: 0.7,
        },
        stabilization: { iterations: 200 },
    },
    interaction: {
        hover: true,
        tooltipDelay: 200,
        zoomView: true,
        dragView: true,
    },
    nodes: {
        font: { size: 11, color: '#333', face: 'Microsoft YaHei' },
        borderWidth: 2,
        shadow: { enabled: true, size: 5 },
    },
    edges: {
        smooth: { type: 'continuous' },
        width: 1,
        selectionWidth: 2,
    },
    groups: {
        Domain:    { color: { background: '#1976D2', border: '#0D47A1' } },
        SubLabel:  { color: { background: '#43A047', border: '#1B5E20' } },
        Question:  { color: { background: '#FB8C00', border: '#E65100' } },
        Answer:    { color: { background: '#9E9E9E', border: '#424242' } },
        Regulation:{ color: { background: '#E53935', border: '#B71C1C' } },
    },
};

const network = new vis.Network(container, data, options);

// 点击节点显示详情
network.on('click', function(params) {
    if (params.nodes.length) {
        const node = nodes.get(params.nodes[0]);
        document.getElementById('tooltip').style.display = 'block';
        document.getElementById('tooltip').querySelector('.type').textContent = node.group;
        document.getElementById('tooltip').querySelector('.label').innerHTML = node.title || node.label;
    } else {
        document.getElementById('tooltip').style.display = 'none';
    }
});

// 双击聚焦
network.on('doubleClick', function(params) {
    if (params.nodes.length) {
        network.focus(params.nodes[0], { scale: 2, animation: true });
    }
});
